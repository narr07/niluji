[package]
name = "niluji-siswa"
version = "0.1.0"
description = "Aplikasi Android untuk siswa NILUJI"
authors = ["Dinar Permadi Yusup"]
license = "MIT"
repository = "https://github.com/narr07/niluji"
edition = "2021"
rust-version = "1.90"

[lib]
name = "niluji_siswa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
serde = { version = "1", features = ["derive"] }
url = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "=2.5.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
