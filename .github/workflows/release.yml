name: Release NILUJI Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - release

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install

      - name: Lint frontend
        run: bun run lint

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  publish-tauri:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install

      - name: Build and Publish Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: NILUJI v__VERSION__
          releaseBody: |
            ## Unduh Installer NILUJI v__VERSION__

            Pilih berkas installer sesuai sistem operasi komputer pengawas/proktor Anda:
            - **Windows (64-bit)**: Unduh berkas `Niluji___VERSION___x64-setup.exe` atau `.msi`
            - **Linux (Debian/Ubuntu)**: Unduh berkas `.deb` atau `.AppImage`
            - **macOS (Apple Silicon / Intel)**: Unduh berkas `.dmg` (jalankan `xattr -cr /Applications/Niluji.app` satu kali di Terminal jika muncul peringatan Gatekeeper)

            Panduan lengkap instalasi, persiapan jaringan LAN/WiFi, dan penggunaan aplikasi dapat dibaca di:
            https://narr07.github.io/niluji/
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
