# Rilis NILUJI: push tag "v<versi>" (mis. v1.1.0) → GitHub membangun installer Windows,
# menandatanganinya untuk update otomatis, lalu membuat GitHub Release berisi installer +
# latest.json. Aplikasi yang sudah terpasang membaca latest.json itu untuk notifikasi update.
#
# Secret yang wajib ada di repo (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           = isi file kunci privat (~/.tauri/niluji.key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  = isi file ~/.tauri/niluji.key.password
# Versi di tag harus sama dengan "version" di src-tauri/tauri.conf.json.
name: release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: bun install

      # Catatan rilis diambil dari RELEASE_NOTES.md — teks ini juga yang tampil di jendela
      # "Pembaruan Aplikasi" pada komputer sekolah.
      - name: Read release notes
        id: notes
        shell: bash
        run: |
          {
            echo "body<<EOF"
            cat RELEASE_NOTES.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Niluji v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
