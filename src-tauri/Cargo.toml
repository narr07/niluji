[package]
name = "niluji"
version = "1.3.0"
description = "NILUJI - Platform CBT offline untuk sekolah"
authors = [ "narr07" ]
license = "MIT"
repository = "https://github.com/narr07/niluji"
edition = "2021"

[lib]
name = "niluji_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[build-dependencies.tauri-build]
version = "2.5.3"
features = [ ]

[dependencies]
tauri-plugin-shell = "2.3.4"
tauri-plugin-dialog = "2"
tauri-plugin-http = "=2.5.0"
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
tower-http = { version = "0.6", features = ["fs"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
csv = "1"
calamine = "0.26"
base64 = "0.22"
reqwest = "0.12"
getrandom = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[features]
default = ["desktop"]
desktop = ["tauri/tray-icon"]

[dependencies.tauri]
version = "=2.9.5"
features = ["unstable"]

[dependencies.serde]
version = "1"
features = [ "derive" ]
